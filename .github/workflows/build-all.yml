name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
      build:
        description: "Build type"
        required: true
        type: choice
        default: "All"
        options:
          - All
          - Binary
          - Android
          - SFA
          - Linux-package
      forceBeta:
        description: "Force beta package name"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.build }}
  cancel-in-progress: true

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
      git_hash: ${{ steps.outputs.outputs.git_hash }}
      full_version: ${{ steps.outputs.outputs.full_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ^1.25.8
      
      - name: Set outputs
        id: outputs
        run: |-
          GIT_HASH=$(git rev-parse --short HEAD)
          FULL_VER="${{ inputs.version }}-${GIT_HASH}"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "git_hash=${GIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VER}" >> "$GITHUB_OUTPUT"

  # ========================================================
  # Job 1: 二进制与 Core 编译 (Linux, Android Core, Windows)
  # ========================================================
  build:
    name: ${{ matrix.name }}
    if: inputs.build == 'All' || inputs.build == 'Binary' || inputs.build == 'Android' || inputs.build == 'Linux-package'
    runs-on: ${{ matrix.runner }}
    needs:
      - calculate_version
    strategy:
      matrix:
        include:
          - { name: "Linux amd64 (musl)", os: linux, arch: amd64, variant: musl, runner: ubuntu-latest, type: binary, debian: amd64 }
          - { name: "Android arm64 core", os: android, arch: arm64, runner: ubuntu-latest, type: android }
          - { name: "Windows amd64", os: windows, arch: amd64, runner: windows-latest, type: binary }
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ^1.25.8
      - name: Setup Android NDK
        if: matrix.os == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          add-to-path: true
          local-cache: false

      - name: Set tag (Linux/Android)
        if: runner.os != 'Windows'
        run: |-
          git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$GITHUB_ENV"
          git tag v${{ needs.calculate_version.outputs.version }} -f
      - name: Set tag (Windows)
        if: runner.os == 'Windows'
        run: |-
          git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$env:GITHUB_ENV"
          git tag v${{ needs.calculate_version.outputs.version }} -f

      - name: Set build tags (Linux)
        if: runner.os != 'Windows' && matrix.type != 'android'
        run: |
          set -xeuo pipefail
          TAGS='with_gvisor,with_quic,with_utls,with_clash_api,with_provider,with_ebpf,badlinkname,tfogo_checklinkname0,with_musl'
          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"
      - name: Set build tags (Android)
        if: matrix.type == 'android'
        run: |
          set -xeuo pipefail
          TAGS='with_quic,with_utls,with_clash_api,with_provider,with_ebpf,badlinkname,tfogo_checklinkname0'
          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"
      - name: Set build tags (Windows)
        if: runner.os == 'Windows'
        run: |
          $TAGS = "with_gvisor,with_quic,with_utls,with_clash_api,with_provider,with_tailscale,badlinkname,tfogo_checklinkname0"
          echo "BUILD_TAGS=$TAGS" >> $env:GITHUB_ENV

      # --- 1. Linux musl 编译 ---
      - name: Build (musl)
        if: matrix.variant == 'musl' && (inputs.build == 'All' || inputs.build == 'Binary' || inputs.build == 'Linux-package')
        run: |
          set -xeuo pipefail
          mkdir -p dist
          make build VERSION="${FULL_VER}"
          mv sing-box dist/
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          TAGS: ${{ env.BUILD_TAGS }}
          FULL_VER: "${{ needs.calculate_version.outputs.full_version }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 2. Android Core 编译 (含 eBPF 支持与完整的 Commit Hash) ---
      - name: Build Android core
        if: matrix.type == 'android' && (inputs.build == 'All' || inputs.build == 'Android')
        run: |
          set -xeuo pipefail
          mkdir -p dist
          TARGET_CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          
          CC=${TARGET_CLANG} BPF_CLANG=${TARGET_CLANG} \
          make build VERSION="${FULL_VER}"
          
          mv sing-box dist/
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm64
          TAGS: ${{ env.BUILD_TAGS }}
          FULL_VER: "${{ needs.calculate_version.outputs.full_version }}"
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # --- 3. Windows 编译 ---
      - name: Build Windows
        if: matrix.os == 'windows' && (inputs.build == 'All' || inputs.build == 'Binary')
        run: |
          mkdir -p dist
          $FULL_VER = "${{ needs.calculate_version.outputs.full_version }}"
          
          go build -v -trimpath -o dist/sing-box.exe -tags "$env:BUILD_TAGS" `
            -ldflags "-X=runtime.godebugDefault=asynctimerchan=1 -X 'github.com/sagernet/sing-box/constant.Version=$FULL_VER' -checklinkname=0 -H windowsgui -s -w -buildid=" `
            ./cmd/sing-box
            
          go build -v -trimpath -o dist/sing-box-cli.exe -tags "$env:BUILD_TAGS" `
            -ldflags "-X=runtime.godebugDefault=asynctimerchan=1 -X 'github.com/sagernet/sing-box/constant.Version=$FULL_VER' -checklinkname=0 -s -w -buildid=" `
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set mtime (Linux)
        if: matrix.variant == 'musl' && (inputs.build == 'All' || inputs.build == 'Binary' || inputs.build == 'Linux-package')
        run: |-
          TZ=UTC touch -t '197001010000' dist/sing-box
      - name: Set package version (Linux)
        if: matrix.variant == 'musl' && (inputs.build == 'All' || inputs.build == 'Binary' || inputs.build == 'Linux-package')
        run: |-
          PKG_VERSION="${{ needs.calculate_version.outputs.version }}"
          PKG_VERSION="${PKG_VERSION//-/\~}"
          echo "PKG_VERSION=${PKG_VERSION}" >> "${GITHUB_ENV}"
      - name: Set package name (DEB)
        if: matrix.debian != '' && (inputs.build == 'All' || inputs.build == 'Linux-package')
        run: |-
          echo "NAME=sing-box" >> "$GITHUB_ENV"
      - name: Package DEB
        if: matrix.debian != '' && (inputs.build == 'All' || inputs.build == 'Linux-package')
        run: |
          set -xeuo pipefail
          sudo gem install fpm
          cp .fpm_systemd .fpm
          fpm -t deb \
            --name "sing-box" \
            -v "$PKG_VERSION" \
            -p "dist/sing-box_${{ needs.calculate_version.outputs.version }}_linux_${{ matrix.debian }}.deb" \
            --architecture ${{ matrix.debian }} \
            --after-install release/config/sing-box.postinst \
            --config-files /etc/sing-box/config.json \
            dist/sing-box=/usr/bin/sing-box \
            release/config/config.json=/etc/sing-box/config.json \
            release/config/sing-box.service=/usr/lib/systemd/system/sing-box.service \
            release/config/sing-box@.service=/usr/lib/systemd/system/sing-box@.service \
            release/config/sing-box.sysusers=/usr/lib/sysusers.d/sing-box.conf \
            release/config/sing-box.initd=/etc/init.d/sing-box
      - name: Set name (Linux/Android)
        if: runner.os != 'Windows'
        run: |-
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            DIR_NAME="${DIR_NAME}-musl"
          fi
          echo "DIR_NAME=${DIR_NAME}" >> "${GITHUB_ENV}"
      - name: Set name (Windows)
        if: runner.os == 'Windows'
        run: |-
          $DIR_NAME = "sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          echo "DIR_NAME=$DIR_NAME" >> $env:GITHUB_ENV
      - name: Archive (Linux/Android)
        if: runner.os != 'Windows'
        run: |
          set -xeuo pipefail
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          cp sing-box "${DIR_NAME}"
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          # Archive GUI version
          mkdir "$env:DIR_NAME"
          Copy-Item ../LICENSE "$env:DIR_NAME"
          Copy-Item sing-box.exe "$env:DIR_NAME"
          Compress-Archive -Path "$env:DIR_NAME" -DestinationPath "$env:DIR_NAME.zip"
          Remove-Item -Recurse "$env:DIR_NAME"
          
          # Archive CLI version
          $CLI_DIR_NAME = "$env:DIR_NAME-cli"
          mkdir "$CLI_DIR_NAME"
          Copy-Item ../LICENSE "$CLI_DIR_NAME"
          Copy-Item sing-box-cli.exe "$CLI_DIR_NAME"
          Compress-Archive -Path "$CLI_DIR_NAME" -DestinationPath "$CLI_DIR_NAME.zip"
          Remove-Item -Recurse "$CLI_DIR_NAME"
      - name: Cleanup (Linux/Android)
        if: runner.os != 'Windows'
        run: rm dist/sing-box
      - name: Cleanup (Windows)
        if: runner.os == 'Windows'
        run: Remove-Item dist/sing-box.exe, dist/sing-box-cli.exe
      - name: Upload artifact (Binary/Android core)
        if: (matrix.type == 'binary' || matrix.type == 'android') && matrix.debian == '' && runner.os != 'Windows' && (inputs.build == 'All' || inputs.build == 'Binary' || inputs.build == 'Android')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: binary-${{ matrix.os }}_${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) }}
          path: "dist"
      - name: Upload artifact (Binary with DEB)
        if: (matrix.type == 'binary' || matrix.type == 'android') && matrix.debian != '' && (inputs.build == 'All' || inputs.build == 'Binary' || inputs.build == 'Linux-package')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: binary-${{ matrix.os }}_${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) }}
          path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Upload artifact (Windows GUI)
        if: runner.os == 'Windows' && (inputs.build == 'All' || inputs.build == 'Binary')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: binary-${{ matrix.os }}_${{ matrix.arch }}
          path: "dist/*[!-cli].zip"
      - name: Upload artifact (Windows CLI)
        if: runner.os == 'Windows' && (inputs.build == 'All' || inputs.build == 'Binary')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: binary-${{ matrix.os }}_${{ matrix.arch }}-cli
          path: "dist/*-cli.zip"
      - name: Upload artifact (DEB package)
        if: matrix.debian != '' && (inputs.build == 'All' || inputs.build == 'Linux-package')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: package-deb-${{ matrix.debian }}
          path: "dist/*.deb"

  # ========================================================
  # Job 2: SFA App 独立编译 (手工选择 SFA 时启动)
  # ========================================================
  build_sfa:
    name: SFA (sing-box for android)
    if: inputs.build == 'SFA'
    runs-on: ubuntu-latest
    needs:
      - calculate_version
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ^1.25.8
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          add-to-path: true
          local-cache: false

      - name: Setup OpenJDK
        run: |-
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version
          
      - name: Checkout SFA Repository
        uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box-for-android
          ref: dev
          path: SFA
          submodules: recursive

      - name: Set tag
        run: |-
          git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$GITHUB_ENV"
          git tag v${{ needs.calculate_version.outputs.version }} -f

      - name: Set build tags (SFA)
        run: |-
          echo "BUILD_TAGS=with_gvisor,with_quic,with_utls,with_clash_api,with_provider,with_conntrack,without_badtls,badlinkname,tfogo_checklinkname0" >> "${GITHUB_ENV}"

      - name: Build SFA (sing-box for android app)
        run: |
         mkdir -p SFA/app/libs/
         make lib_install
         FULL_VER="${{ needs.calculate_version.outputs.full_version }}"
         CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
         
         CGO_ENABLED=1 CC=${CC} gomobile bind -v \
         -target android \
         -androidapi 23 \
         -javapkg=io.nekohasekai \
         -libname=box \
         -trimpath  \
         -buildvcs=false \
         -ldflags "-X github.com/sagernet/sing-box/constant.Version=${FULL_VER} -s -w -buildid= -checklinkname=0" \
         -tags "${BUILD_TAGS}" \
         ./experimental/libbox
    
         cp libbox.aar SFA/app/libs/
         cd SFA
         git fetch origin dev
         git checkout dev
         git pull origin dev
         sed -i '/signingConfigs {/,/^    }/d' app/build.gradle.kts
         sed -i '/signingConfig = signingConfigs/d' app/build.gradle.kts
         chmod +x ./gradlew
         ./gradlew :app:clean :app:assembleOtherRelease && ./gradlew --stop
        env:
         ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
         JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Sign SFA
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: SFA/app/build/outputs/apk/other/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload artifact (SFA)
        uses: actions/upload-artifact@v7.0.0
        with:
          name: SFA-${{ needs.calculate_version.outputs.version }}
          path: SFA/app/build/outputs/apk/other/release/*arm64-v8a-unsigned-signed.apk

  # ========================================================
  # Job 3: 发布上传
  # ========================================================
  upload:
    name: Upload builds
    if: "!failure() && !cancelled() && inputs.build != ''"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - calculate_version
      - build
      - build_sfa
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Cache ghr
        uses: actions/cache@v4
        id: cache-ghr
        with:
          path: |
            ~/go/bin/ghr
          key: ghr
      - name: Setup ghr
        if: steps.cache-ghr.outputs.cache-hit != 'true'
        run: |-
          cd $HOME
          git clone https://github.com/nekohasekai/ghr ghr
          cd ghr
          go install -v .
      - name: Set tag
        run: |-
          git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$GITHUB_ENV"
          git tag v${{ needs.calculate_version.outputs.version }} -f
          echo "VERSION=${{ needs.calculate_version.outputs.version }}" >> "$GITHUB_ENV"
      - name: Download builds
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Upload builds
        if: ${{ env.PUBLISHED == 'false' }}
        run: |-
          export PATH="$PATH:$HOME/go/bin"
          PRERELEASE_FLAG=""
          if [ "${{ inputs.forceBeta }}" = "true" ]; then
            PRERELEASE_FLAG="-prerelease"
          fi
          ghr --replace $PRERELEASE_FLAG -p 5 -n "${VERSION}" "v${VERSION}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Replace builds
        if: ${{ env.PUBLISHED != 'false' }}
        run: |-
          export PATH="$PATH:$HOME/go/bin"
          PRERELEASE_FLAG=""
          if [ "${{ inputs.forceBeta }}" = "true" ]; then
            PRERELEASE_FLAG="-prerelease"
          fi
          ghr --replace $PRERELEASE_FLAG -p 5 -n "${VERSION}" "v${VERSION}" dist
        env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
