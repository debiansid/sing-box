name: Verify eBPF program loading

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ebpf-verifier.yml'
      - 'common/ebpf/**'
      - 'protocol/ebpf/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Linux kernel verifier
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.12

      - name: Generate TC object
        run: make -C common/ebpf generate

      - name: Load program matrix
        shell: bash
        run: |
          set -euo pipefail
          cgroup_path=/sys/fs/cgroup/sing-box-ebpf-verifier
          sudo mkdir "$cgroup_path"
          trap 'sudo rmdir "$cgroup_path"' EXIT
          sudo env \
            "PATH=$PATH" \
            SING_BOX_EBPF_INTEGRATION=1 \
            SING_BOX_EBPF_INTEGRATION_CGROUP="$cgroup_path" \
            go test -v -count=1 \
              -run 'Test(CgroupBackendProgramLoad|SharedNetwork(SharedMap|Standalone)ProgramLoad)Integration' \
              -tags with_ebpf,ebpf_integration \
              ./common/ebpf
